name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app tests evaluation scripts
      - run: python -m ruff format --check app tests evaluation scripts
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - run: python -m evaluation.run --output reports/dry-run.json
      - run: python -m compileall -q app evaluation scripts
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t ai-reviewer:test .
      - name: Smoke test API image
        run: |
          docker run -d --name reviewer -p 127.0.0.1:8000:8000 ai-reviewer:test
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs reviewer
          exit 1
